<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>DTS Klein T eile</title>
  <script type="module" src="node_modules/htmx-ext-client-side-templates"></script>
  <script type="module" src="src/index.js"></script>
  <meta name="htmx-config" content='{"selfRequestsOnly":false}'>
  <style> 
    .columns {
	display: grid;
	width: 100%;
	grid-template-columns: 1fr 4fr;
    }
    #document {
	width: 90%;
	height: 100%;
    }
    .portion-selector {
	width: 30em;
    }
  </style>
  <script src="src/fun.js"></script>
</head>
<body>
  <div hx-ext="client-side-templates" class="content-container">

    <div class="entry-form-container">
      <form id="entry-form" method="post">
	<label for="entry-endpoint-uri">Entry Endpoint URI</label>
	<input id="entry-endpoint-uri" name="entry-endpoint-uri" type="string" size="60em" value="http://localhost:8080/file/bible/entry"></input>
	<input type="submit" value="Go!"></input>
      </form>
    </div>
    <hr/>


    <div class="columns">
      <div id="collection-container" class="column collection-tree">
      </div>

      <div id="resource-container">
	<div id="navigation-container">
	  <form id="navigation-form">
	  </form>
	</div>
	<div id="document-container">
	  <iframe id="document"></iframe>
	</div>
      </div>
    </div>

  </div>

</body>
</html>
