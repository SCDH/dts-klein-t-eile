<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>DTS Klein T eile</title>
  <script type="module" src="node_modules/htmx-ext-client-side-templates"></script>
  <script type="module" src="src/index.js"></script>
  <meta name="htmx-config" content='{"selfRequestsOnly":false}'>

</head>
<body>
  <div hx-ext="client-side-templates">

    <div class="entry-form-container">
      <form id="entry-form" method="post">
	<label for="entry-endpoint-uri">Entry Endpoint URI</label>
	<input id="entry-endpoint-uri" name="entry-endpoint-uri" type="string" size="60em" value="http://localhost:8080/file/bible/entry"></input>
	<input type="submit" value="Go!"></input>
      </form>
    </div>


    <div id="collection-container" class="collection-tree">
    </div>

  </div>

  <script id="collection-start" type="nunjucks">
    <button hx-get="{{ uriTemplate(collection, {}) }}"
    hx-swap="innerHTML"
    hx-target="#collection"
    nunjucks-template="t-collection"
    >{{ uriTemplate(collection, {}) }}</button>
    <ul id="collection" class="collection">
    </ul>
  </script>

  <script id="t-collection" type="nunjucks">
    {% macro metadata(member) %}
    <div>{{ member.@type }}</div>
    <div>{{ member.title }}</div>
    {% endmacro %}

    {% macro collectionItem(member, id) %}
    <li id="collection-item-{{ id }}" class="collection-item {{ member.@type }}">
    {{ metadata(member) }}
    {% if member.@type == 'Collection' %}
    <button
    hx-get="{{ uriTemplate(member.collection, {}) }}"
    hx-swap="innerHTML"
    hx-target="#collection-item-{{ id }}"
    nunjucks-template="t-collection"
    >{{ uriTemplate(member.collection, {}) }}</button>
    {% endif %}
    </li>
    {% endmacro %}


    <li class="collection-item {{ @type }}">
    {{ metadata(getContext()) }}

    {% if member %}
    <ul class="collection">
    {% for m in member %}
    {{ collectionItem(m, collectionRequestNo()) }}
    {% endfor %}
    </ul>
    {% endif %}

    </li>

  </script>

</body>
</html>
