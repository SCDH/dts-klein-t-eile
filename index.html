<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>DTS Klein T eile</title>
  <script type="module" src="node_modules/htmx-ext-client-side-templates"></script>
  <script type="module" src="src/index.js"></script>
  <meta name="htmx-config" content='{"selfRequestsOnly":false}'>

</head>
<body>
  <div hx-ext="client-side-templates">

    <button hx-get="http://localhost:8080/file/bible/collection"
            hx-swap="innerHTML"
            hx-target="#collection"
            nunjucks-template="t-collection"
	    >
      Start
    </button>

    <div class="collection-tree">
      <ul id="collection" class="collection">
      </ul>
    </div>

  </div>

  <script id="t-collection" type="nunjucks">
    {% macro metadata(member) %}
    <div>{{ member.@type }}</div>
    <div>{{ member.title }}</div>
    {% endmacro %}

    <li class="collection-item {{ @type }}">
    {{ metadata(getContext()) }}

    {% if member %}
    <ul class="collection">
    {% for m in member %}
    <li class="collection-item {{ m.@type }}">
    {{ metadata(m) }}
    </li>
    {% endfor %}
    </ul>
    {% endif %}

    </li>

  </script>

</body>
</html>
